<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bar" id="bar">
  <div id="draftNote" style="width:100%;text-align:center;color:var(--gold);font-size:13px;display:none">⚠ فيه تعديلات لسه ما اتنشرتش — دوس «تصدير» وارفع data.json على GitHub</div>
  <button class="btn s" onclick="editGame()">+ إضافة لعبة</button>
  <button class="btn o s" onclick="editSettings()">إعدادات الموقع</button>
  <button class="btn o s" onclick="exportData()">تصدير data.json للنشر</button>
  <button class="btn o s" onclick="document.getElementById('imp').click()">استيراد</button>
  <button class="btn o s" onclick="discardDraft()">رجوع للنسخة المنشورة</button>
  <button class="btn d s" onclick="logout()">خروج</button>
  <input type="file" id="imp" accept=".json" hidden onchange="importData(this)">
</div>

<div class="wrap">
  <header>
    <div id="logoBox"></div>
    <div class="rule"><span>✦</span></div>
    <div class="tag" id="tagline"></div>
    <a class="tg" id="tgLink" target="_blank" rel="noopener" style="display:none">تابعنا على تيليجرام</a>
  </header>
  <div class="search"><input id="q" placeholder="ابحث عن لعبة…" oninput="render()"></div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div id="foot"></div>
</footer>

<!-- نافذة عرض اللعبة -->
<div class="modal" id="mView" onclick="if(event.target===this)closeM('mView')"><div class="box" id="viewBox"></div></div>
<!-- نافذة التعديل -->
<div class="modal" id="mEdit" onclick="if(event.target===this)closeM('mEdit')"><div class="box" id="editBox"></div></div>
<div id="toast"></div>

<script>window.ADMIN=true</script>
<script src="script.js"></script>
</body>
</html>
