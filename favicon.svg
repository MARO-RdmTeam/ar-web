<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191e"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd7aa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8a97e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#c8a97e" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Subtle inner radial glow -->
  <circle cx="32" cy="32" r="22" fill="#c8a97e" fill-opacity="0.08"/>
  <!-- Brand polygon emblem (Diamond/Gem localization emblem) scaled to 64x64 -->
  <g transform="translate(8, 8) scale(2)" filter="url(#glow)">
    <polygon points="6 3 18 3 21 8 12 22 3 8 6 3" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="11" r="2.2" fill="url(#goldGrad)"/>
    <line x1="6" y1="3" x2="12" y2="11" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="18" y1="3" x2="12" y2="11" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="3" y1="8" x2="12" y2="11" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="21" y1="8" x2="12" y2="11" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="12" y1="22" x2="12" y2="11" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>
