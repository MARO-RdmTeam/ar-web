<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمار للتعريب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- الصفحة الرئيسية -->
<main id="home" class="view">
  <div class="wrap">
    <header>
      <div id="logoBox"></div>
      <div class="rule"><span>✦</span></div>
      <div class="tag" id="tagline"></div>
      <a class="tg" id="tgLink" target="_blank" rel="noopener" style="display:none">تابعنا على تيليجرام</a>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="ابحث عن لعبة…" oninput="render()">
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<!-- صفحة اللعبة (بتتملى تلقائي) -->
<main id="game" class="view" hidden></main>

<footer><div id="foot"></div></footer>
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
